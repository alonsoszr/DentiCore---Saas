# Pruebas de mutación nocturnas (TASK-002; SDD §6.1 y §6.4, RNF-127).
# En E1 solo reportan: no bloquean la integración.
name: api-mutation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: denticore-api

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: denticore_testing
      DB_USERNAME: denticore_app
      DB_PASSWORD: app_ci
      DB_MIGRATOR_USERNAME: denticore_migrator
      DB_MIGRATOR_PASSWORD: migrator_ci
      DB_PLATFORM_USERNAME: denticore_platform
      DB_PLATFORM_PASSWORD: platform_ci
    steps:
      - uses: actions/checkout@v4
      - working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          DENTICORE_MIGRATOR_PASSWORD: migrator_ci
          DENTICORE_APP_PASSWORD: app_ci
          DENTICORE_PLATFORM_PASSWORD: platform_ci
        run: bash infra/postgres/init.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, pgsql, zip, pcntl
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - run: |
          cp .env.example .env
          php artisan key:generate
      # Servicios críticos de SDD §6.1: aislamiento, odontograma, presupuestos, pagos,
      # citas y riesgo. Se amplía la lista de clases a medida que existen.
      - run: vendor/bin/pest --mutate --everything --covered-only --parallel
