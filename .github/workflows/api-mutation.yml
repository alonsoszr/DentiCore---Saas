# Pruebas de mutación nocturnas (TASK-002; SDD §6.1 y §6.4, RNF-127).
# En E1 solo reportan: no bloquean la integración (RNF-127 es *Should* y bloquea desde E3, Plan §6.1).
#
# TASK-097: hasta E1 el job corría `pest --mutate --everything --parallel` con `continue-on-error`.
# Las pruebas en paralelo crean una base por proceso con el rol de la API, que no tiene CREATEDB, y
# las migraciones corren con otra conexión (pgsql_migrator): la corrida fallaba al empezar y el
# MSI nunca se midió. Ahora cada servicio crítico corre en su propio job, en serie, y el job falla
# si la herramienta falla; el MSI queda en el resumen de la corrida.
name: api-mutation

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: denticore-api

jobs:
  mutate:
    name: Mutación (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # Servicios críticos de SDD §6.1 (los pagos son de E3), las mismas carpetas que
      # scripts/coverage/critical.mjs.
      matrix:
        include:
          - service: Aislamiento
            path: app/Support/Tenancy
          - service: Odontograma
            path: app/Modules/Odontogram/Services
          - service: Presupuestos
            path: app/Modules/Treatment/Services
          - service: Citas
            path: app/Modules/Scheduling/Services
          - service: Riesgo
            path: app/Modules/Risk/Services
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Mismos servicios que el job de Pest de api.yml (TASK-095): sin Redis fallaban las pruebas del
      # Circuit Breaker (DI-12) y sin Mailpit la de entrega real de correo (RF-155).
      mailpit:
        image: axllent/mailpit
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ['1025:1025', '8025:8025']
      redis:
        image: redis:7-alpine
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: denticore_testing
      DB_USERNAME: denticore_app
      DB_PASSWORD: app_ci
      DB_MIGRATOR_USERNAME: denticore_migrator
      DB_MIGRATOR_PASSWORD: migrator_ci
      DB_PLATFORM_USERNAME: denticore_platform
      DB_PLATFORM_PASSWORD: platform_ci
    steps:
      - uses: actions/checkout@v4
      - working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          DENTICORE_MIGRATOR_PASSWORD: migrator_ci
          DENTICORE_APP_PASSWORD: app_ci
          DENTICORE_PLATFORM_PASSWORD: platform_ci
        run: bash infra/postgres/init.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, pgsql, zip, pcntl
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - run: |
          cp .env.example .env
          php artisan key:generate
      - name: Pest --mutate sobre ${{ matrix.path }}
        env:
          SERVICE: ${{ matrix.service }}
          MUTATE_PATH: ${{ matrix.path }}
        run: |
          set -o pipefail
          vendor/bin/pest --mutate --path="$MUTATE_PATH" --covered-only --no-cache 2>&1 | tee mutation.log
          {
            echo "## Mutación: $SERVICE (\`$MUTATE_PATH\`)"
            echo
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' mutation.log | grep -E 'Mutations:|Score:|Duration:' || echo 'Sin resumen de mutación'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.service }}
          path: denticore-api/mutation.log
