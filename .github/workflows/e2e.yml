# Pruebas E2E (TASK-020; SDD §6.1 y §6.4: 100 % en verde y ≤ 20 min en la rama principal).
# Levanta el entorno de docker-compose.yml, la API con la semilla de demostración
# (datos sintéticos) y la SPA compilada; ejecuta Playwright con axe-core. La matriz de TASK-094
# (RNF-051, RNF-052) corre un job por navegador con sus cuatro anchos, cada uno con su propio
# entorno, y el job `e2e` resume el resultado para la protección de main.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cuenta de Docker Hub para las descargas de imágenes (secretos del repositorio; opcional).
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # Checks requeridos de main: el workflow corre en todo PR y este trabajo decide si el PR
  # toca el código o el entorno; si no, los demás trabajos se saltan y el trabajo final igual reporta.
  changes:
    name: Cambios en el código o el entorno
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$GITHUB_SHA" | grep -qE '^(denticore-api/|denticore-spa/|denticore-ml/|infra/|load/|docker-compose\.yml$|\.github/workflows/e2e\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  browser:
    name: e2e (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, msedge, firefox, webkit]
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4

      # Docker Hub limita las descargas anónimas desde los runners compartidos (429 «toomanyrequests»);
      # con la cuenta del proyecto el límite es mucho mayor. Sin los secretos, el paso se omite.
      - name: Iniciar sesión en Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Entorno Compose (sin antivirus)
        run: docker compose up -d --wait postgres redis minio mailpit ml

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pdo_pgsql, pgsql, zip, pcntl
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api

      - name: API con datos de demostración
        working-directory: denticore-api
        run: |
          cp .env.example .env
          # Todas las sesiones de Playwright salen de la misma IP: se eleva throttle:login (RF-035).
          echo "LOGIN_ATTEMPTS_PER_MINUTE=1000" >> .env
          echo "API_REQUESTS_PER_MINUTE=1000" >> .env
          # Clave de sellado de evidencias (DD-46) propia de esta ejecución.
          echo "EVIDENCE_HMAC_KEY=$(openssl rand -hex 32)" >> .env
          php artisan key:generate
          php artisan migrate --database=pgsql_migrator --force
          php artisan db:seed --force
          # Modelo de riesgo 1.0.0 (MS-05): el contenedor ml arranca sin artefactos; se entrena con la
          # semilla fija, se sube al bucket de MinIO (que crea minio-setup; DI-18) y Laravel lo registra y
          # activa (RN-84, supuesto S-09).
          docker compose -f ../docker-compose.yml run --rm minio-setup
          docker compose -f ../docker-compose.yml exec -T ml python -m denticore_ml.training --version 1.0.0 --out models --commit "$GITHUB_SHA" --upload
          php artisan risk:register-model 1.0.0 --activate
          # Varios procesos del servidor de PHP: T-176 (k6) necesita reservas de verdad simultáneas.
          PHP_CLI_SERVER_WORKERS=8 php artisan serve --port=8000 > ../api.log 2>&1 &
          # Correos de invitación (outbox → cola → Mailpit), como el worker de producción.
          php artisan outbox:dispatch > ../outbox.log 2>&1 &
          php artisan queue:work redis --queue=critical,notifications,documents,heavy,default > ../worker.log 2>&1 &

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: denticore-spa/package-lock.json

      - name: SPA compilada
        working-directory: denticore-spa
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
          npm run build
          npx vite preview --port 5173 --strictPort > ../spa.log 2>&1 &
          npx wait-on -t 60000 http://localhost:5173 http://localhost:8000/up

      - name: Playwright
        working-directory: denticore-spa
        run: npm run e2e -- --grep-invert @motor-detenido

      # T-176 (TASK-091; RNF-038, RN-46): 50 reservas simultáneas del mismo horario dan 1 éxito y 49
      # conflictos sin errores 5xx. El resumen de k6 queda como artefacto para el informe de E1.
      - name: Concurrencia de reservas (k6, T-176)
        if: matrix.browser == 'chromium'
        run: |
          mkdir -p load-results
          docker run --rm --network host -u "$(id -u):$(id -g)" \
            -v "$PWD/load:/load:ro" -v "$PWD/load-results:/results" \
            grafana/k6:0.54.0 run -e API_URL=http://localhost:8000/api/v1 \
            --summary-export /results/pc-e-summary.json /load/pc-e.js

      # TASK-083 (criterio 2) y RT-01: con el motor ML detenido la atención continúa y la pantalla
      # muestra «Predicción no disponible» (RN-64, CA-55.3).
      - name: Playwright con el motor ML detenido
        working-directory: denticore-spa
        run: |
          docker compose -f ../docker-compose.yml stop ml
          # Un proyecto a la vez: los anchos comparten la atención de la paciente de DemoRiskSeeder.
          npm run e2e -- --grep @motor-detenido --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            denticore-spa/playwright-report
            api.log
            spa.log
            outbox.log
            worker.log
            load-results

  # Check requerido de main: verde si la matriz pasó o si el PR no toca el código ni el entorno.
  e2e:
    needs: [changes, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado de la matriz
        run: |
          echo "Cambios relevantes: ${{ needs.changes.outputs.relevant }}; matriz: ${{ needs.browser.result }}"
          test "${{ needs.changes.result }}" = "success"
          case "${{ needs.browser.result }}" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
