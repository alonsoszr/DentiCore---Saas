# Pipeline del motor ML (TASK-074; SDD §1.11 y §6.4):
# ruff → mypy estricto → pytest con cobertura ≥ 80 % → pip-audit → imagen denticore-ml.
name: ml

on:
  pull_request:
    paths:
      - 'denticore-ml/**'
      - '.github/workflows/ml.yml'
  push:
    branches: [main]
    paths:
      - 'denticore-ml/**'
      - '.github/workflows/ml.yml'

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: denticore-ml

jobs:
  checks:
    name: Lint, tipos, pruebas y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: denticore-ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: mypy estricto
        run: mypy
      - name: pytest con cobertura (≥ 80 %)
        run: pytest --cov --cov-report=term-missing
      - name: pip-audit (dependencias de ejecución)
        run: pip-audit -r requirements.txt

  image:
    name: Imagen denticore-ml
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        working-directory: .
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denticore-ml" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: denticore-ml
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml
