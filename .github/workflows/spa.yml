# Pipeline de la SPA (TASK-003; SDD §1.11 y §6.4):
# ESLint + Prettier → Vitest con cobertura ≥ 70 % → build con presupuesto de JS
# inicial ≤ 300 KB comprimido → npm audit → imagen denticore-spa (nginx con CSP).
name: spa

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'denticore-spa/**'
      - 'denticore-api/openapi.json'
      - '.github/workflows/spa.yml'

concurrency:
  group: spa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: denticore-spa

jobs:
  # Checks requeridos de main: el workflow corre en todo PR y este trabajo decide si el PR
  # toca denticore-spa; si no, los demás trabajos se saltan y el trabajo final igual reporta.
  changes:
    name: Cambios en denticore-spa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA...$GITHUB_SHA" | grep -qE '^(denticore-spa/|denticore-api/openapi\.json$|\.github/workflows/spa\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, pruebas, build y auditoría
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: denticore-spa/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Esquemas zod al día con el contrato OpenAPI
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schemas.js
      - name: Vitest con cobertura
        run: npm run test:coverage
      - name: Build y presupuesto del JS inicial
        run: |
          npm run build
          npm run check:size
      - name: npm audit (sin vulnerabilidades altas o críticas)
        run: npm audit --audit-level=high

  image:
    name: Imagen denticore-spa
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        working-directory: .
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denticore-spa" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: denticore-spa
          file: denticore-spa/docker/Dockerfile
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=spa
          cache-to: type=gha,mode=max,scope=spa

  # Check requerido «spa» de la regla de main: pasa si los trabajos pasaron o se saltaron
  # porque el PR no toca estas rutas; falla si alguno falló o se canceló.
  gate:
    name: spa
    if: always()
    needs: [changes, checks, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resultado del pipeline
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
