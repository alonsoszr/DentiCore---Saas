# Pipeline de la API (TASK-002; SDD §1.11 y §6.4):
# lint → análisis estático → pruebas → OpenAPI → build de imágenes.
# El repositorio es un monorepo: el pipeline solo corre cuando cambia denticore-api/.
name: api

on:
  pull_request:
    paths:
      - 'denticore-api/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'denticore-api/**'
      - '.github/workflows/api.yml'

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: denticore-api

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: bcmath, intl, pdo_pgsql, pgsql, zip, pcntl

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - run: vendor/bin/pint --test

  static:
    name: Análisis estático (Larastan)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  security:
    name: Dependencias, secretos y SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - name: composer audit
        run: composer audit --no-interaction
      - name: Escaneo de secretos (gitleaks)
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
      - name: SAST (semgrep, RNF-104)
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config /src/.semgrep.yml --error /src/app /src/database /src/routes

  tests:
    name: Pruebas (Pest + PostgreSQL 16)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # TASK-022: la prueba de entrega real de correo (RF-155) consulta la API de Mailpit.
      mailpit:
        image: axllent/mailpit
        ports: ['1025:1025', '8025:8025']
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: denticore_testing
      # SDD §2.13: pruebas con el rol de la API y migraciones con el propietario.
      DB_USERNAME: denticore_app
      DB_PASSWORD: app_ci
      DB_MIGRATOR_USERNAME: denticore_migrator
      DB_MIGRATOR_PASSWORD: migrator_ci
      DB_PLATFORM_USERNAME: denticore_platform
      DB_PLATFORM_PASSWORD: platform_ci
    steps:
      - uses: actions/checkout@v4
      - name: Roles y bases de PostgreSQL (infra/postgres/init.sh)
        working-directory: .
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          DENTICORE_MIGRATOR_PASSWORD: migrator_ci
          DENTICORE_APP_PASSWORD: app_ci
          DENTICORE_PLATFORM_PASSWORD: platform_ci
        run: bash infra/postgres/init.sh
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
      - uses: ramsey/composer-install@v3
        with:
          working-directory: denticore-api
      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate
      # SDD §6.4: 100 % en verde y cobertura de líneas ≥ 80 % en el backend.
      - name: Pest con cobertura
        run: vendor/bin/pest --coverage --min=80 --coverage-clover=coverage.xml
      # SDD §4.1 (RNF-044): el documento versionado debe coincidir con el generado del código.
      # Va en este job porque Scramble lee el esquema de la BD (ya migrado por Pest) para
      # tipar los modelos; sin BD el documento generado sería distinto.
      - name: Exportar OpenAPI 3.1 y comparar
        run: |
          php artisan scramble:export
          git diff --exit-code -- openapi.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: denticore-api/coverage.xml

  build:
    name: Imágenes api · worker · scheduler
    needs: [tests, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, worker, scheduler]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        working-directory: .
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/denticore-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: denticore-api
          file: denticore-api/docker/Dockerfile
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
