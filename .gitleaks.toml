# Configuración de gitleaks (RNF-100, DoD-12): reglas por defecto más una excepción.
title = "DentiCore"

[extend]
useDefault = true

[allowlist]
description = "Pruebas automatizadas y semilla local: solo datos sintéticos (RES-08); sus contraseñas y el secreto TOTP de demostración no son secretos."
paths = ['''^denticore-api/tests/''', '''^denticore-spa/e2e/''']
regexes = ['''JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP''']
