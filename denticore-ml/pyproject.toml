# Motor ML de DentiCore (TASK-074; SDD §4.6, IE-02; RES-04).
# Las dependencias fijadas están en requirements.txt (ejecución) y requirements-dev.txt.
[project]
name = "denticore-ml"
version = "0.1.0"
description = "Motor de predicción de riesgo de caries de DentiCore"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# El texto en español usa la raya corta en rangos (0–10, A1–A4).
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma de comprobar en pytest.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

# scikit-learn y moto no publican tipos.
[[tool.mypy.overrides]]
module = ["sklearn.*", "moto.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["src/denticore_ml"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
