# Entorno local de DentiCore (TASK-001; SDD §1.11).
#
#   docker compose up -d
#
# La API (denticore-api) y la SPA (denticore-spa) se ejecutan en el equipo con
# `php artisan serve` y `npm run dev`; este archivo levanta sus dependencias.
# Los puertos del equipo se pueden cambiar con variables (ver .env.example de la API);
# por defecto PostgreSQL usa 5433 y Redis 6380 para no chocar con instalaciones nativas.
#
# Las contraseñas por defecto son solo para desarrollo local con datos sintéticos (RES-08).

name: denticore

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_local}
      DENTICORE_MIGRATOR_PASSWORD: ${DENTICORE_MIGRATOR_PASSWORD:-migrator_local}
      DENTICORE_APP_PASSWORD: ${DENTICORE_APP_PASSWORD:-app_local}
      DENTICORE_PLATFORM_PASSWORD: ${DENTICORE_PLATFORM_PASSWORD:-platform_local}
    ports:
      - '${FORWARD_DB_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-denticore.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d denticore']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '${FORWARD_REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # Las imágenes oficiales minio/minio y minio/mc ya no se publican (Docker Hub y
  # quay.io rechazan la descarga). Se usa pgsty/minio, fork comunitario que distribuye
  # el mismo binario de MinIO con la misma API S3 y el cliente mc.
  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-denticore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-denticore_local}
    ports:
      - '${FORWARD_MINIO_PORT:-9000}:9000'
      - '${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Crea el bucket con versionado (SDD §1.2: S3 versionado) y termina.
  minio-setup:
    image: pgsty/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-denticore}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-denticore_local}
      MINIO_BUCKET: ${MINIO_BUCKET:-denticore}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc version enable local/$$MINIO_BUCKET
      "
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20

  # Escáner antivirus de stored_files (SDD DI-16, RNF-103). La herramienta no está
  # definida en el SDD: se usa ClamAV como supuesto S-08 del plan (pregunta PL-02).
  clamav:
    image: clamav/clamav:stable
    ports:
      - '${FORWARD_CLAMAV_PORT:-3310}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  # Motor ML provisional: solo GET /v1/health hasta TASK-074.
  ml:
    image: python:3.12-slim
    command: ['python', '/app/server.py']
    volumes:
      - ./infra/ml-stub:/app:ro
    ports:
      - '${FORWARD_ML_PORT:-8001}:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  clamav-data:
